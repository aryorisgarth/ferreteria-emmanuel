name: Ferretería Emmanuel CI/CD

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  verificacion-calidad:
    name: Verificación de Calidad y Compilación
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código fuente
        uses: actions/checkout@v4

      - name: Configurar Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Instalar dependencias limpias
        run: npm ci

      - name: Verificación estricta de tipos TypeScript
        run: npx tsc --noEmit

      - name: Verificación de reglas de negocio y Costo Promedio Ponderado (CPP)
        run: npm run verificar

      - name: Compilación de producción Next.js
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
          AUTH_SECRET: ${{ secrets.AUTH_SECRET || 'clave_secreta_temporal_ci_cd_ferreteria_emmanuel_2026' }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

